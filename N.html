<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>من محمد إلى نرجس - أحلى وردة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #08020f;
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Ambient glow overlay */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 40%, rgba(5, 1, 12, 0.8) 100%);
    }
    /* Control bar */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(25, 10, 40, 0.65);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">

  <canvas id="canvas"></canvas>
  <div class="vignette"></div>

  <!-- Interactive Controls Bar -->
  <div class="controls transition-all duration-300 hover:scale-105">
    <button id="replayBtn" class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-semibold rounded-full text-sm shadow-lg hover:shadow-pink-500/30 transition">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      إعادة العرض
    </button>
    <button id="pauseBtn" class="flex items-center gap-2 px-4 py-2 bg-slate-800/80 hover:bg-slate-700/80 text-pink-200 border border-pink-500/30 rounded-full text-sm transition">
      <span id="pauseIcon">⏸️</span>
      <span id="pauseText">إيقاف مؤقت</span>
    </button>
  </div>

<script>
/**
 * Animation Core Architecture
 * Dynamic 6-Stage Timeline Engine on HTML5 Canvas
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;
let isPaused = false;

// Global Animation State Timers
let currentStage = 1;
let globalTime = 0;
let stageStartTime = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;
}
window.addEventListener('resize', resize);
resize();

// --- 1. Ambient Floating Glowing Particles ---
class AmbientParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedY = -(Math.random() * 0.6 + 0.2);
    this.speedX = (Math.random() - 0.5) * 0.4;
    this.alpha = Math.random() * 0.6 + 0.2;
    this.hue = Math.random() * 60 + 320; // Pinks, purples, golds
  }
  update() {
    this.y += this.speedY;
    this.x += this.speedX;
    if (this.y < -10 || this.x < -10 || this.x > width + 10) {
      this.reset();
      this.y = height + 10;
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = `hsl(${this.hue}, 100%, 75%)`;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 65%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const ambientParticles = Array.from({ length: 70 }, () => new AmbientParticle());

// --- 2. Fireworks Explosions ---
class FireworkParticle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 7 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.018 + 0.008;
    this.size = Math.random() * 2.5 + 1.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.06; // Gravity
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

let fireworks = [];
function spawnFirework(x, y) {
  const palette = ['#ff2a6d', '#ff758c', '#ffb700', '#00e5ff', '#e040fb', '#ffffff', '#ff1744'];
  const color = palette[Math.floor(Math.random() * palette.length)];
  for (let i = 0; i < 55; i++) {
    fireworks.push(new FireworkParticle(x, y, color));
  }
}

// --- 3. Heart Points (Drawn Right to Left) ---
const heartPoints = [];
const heartSteps = 180;
function generateHeartPoints() {
  heartPoints.length = 0;
  const scale = Math.min(width, height) / 48;
  // Sweep parameter t from PI down to -PI (Right half to Left half)
  for (let i = 0; i <= heartSteps; i++) {
    let t = Math.PI - (i / heartSteps) * (2 * Math.PI);
    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    heartPoints.push({ x: x * scale, y: y * scale });
  }
}
generateHeartPoints();

// Stage Variables
let heartDrawProgress = 0;
let heartSplitOffset = 0;
let nameGlowAlpha = 0;
let mainRoseStemProg = 0;
let mainRoseBloomProg = 0;

// Typewriter Stage Variables
const messageText = "من محمد إليك يا أحلى وردة";
let typedCharCount = 0;
let typeWriterTimer = 0;

// Hands & Flying Rose Stage Variables
let handsProgress = 0; // 0 to 1 for hands entering
let roseTravelProgress = 0; // 0 to 1 for rose gliding left to right

function resetAnimation() {
  currentStage = 1;
  globalTime = 0;
  stageStartTime = 0;
  fireworks = [];
  heartDrawProgress = 0;
  heartSplitOffset = 0;
  nameGlowAlpha = 0;
  mainRoseStemProg = 0;
  mainRoseBloomProg = 0;
  typedCharCount = 0;
  typeWriterTimer = 0;
  handsProgress = 0;
  roseTravelProgress = 0;
  generateHeartPoints();
}

// --- Drawing Helper Functions ---

/**
 * Stage 3: Glowing "نرجس" Arabic Calligraphy Reveal
 */
function drawGlowingName(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `bold ${Math.min(width * 0.1, 70)}px 'Reem Kufi', 'Amiri', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Outer multi-layer ambient glow
  ctx.shadowBlur = 35;
  ctx.shadowColor = '#ff4081';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('نرجس', centerX, centerY - 25);
  
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff80ab';
  ctx.fillStyle = '#fff5f8';
  ctx.fillText('نرجس', centerX, centerY - 25);
  ctx.restore();
}

/**
 * Stage 4: Central Decorative Rose Growing upward below the name
 */
function drawGrowingCenterRose(stemProg, bloomProg) {
  const startX = centerX;
  const startY = height - 20;
  const targetY = centerY + 110;
  const currY = startY - (startY - targetY) * stemProg;

  ctx.save();
  // Draw Stem
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.quadraticCurveTo(startX - 25, (startY + currY) / 2, startX, currY);
  ctx.strokeStyle = '#2e7d32';
  ctx.lineWidth = 5;
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#1b5e20';
  ctx.stroke();

  // Leaves
  if (stemProg > 0.4) {
    drawLeaf(startX - 10, startY - (startY - targetY) * 0.35, -Math.PI / 4, 1);
  }
  if (stemProg > 0.75) {
    drawLeaf(startX + 10, startY - (startY - targetY) * 0.65, Math.PI / 4, 1);
  }

  // Bloom
  if (bloomProg > 0) {
    ctx.translate(startX, targetY);
    ctx.scale(bloomProg, bloomProg);
    drawRoseBud(0, 0, 1.1);
  }
  ctx.restore();
}

function drawLeaf(x, y, angle, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(18, -12, 35, 0);
  ctx.quadraticCurveTo(18, 12, 0, 0);
  ctx.fillStyle = '#388e3c';
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#1b5e20';
  ctx.fill();
  ctx.restore();
}

function drawRoseBud(x, y, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  
  const petalLayers = [
    { count: 7, radius: 28, color: '#c2185b' },
    { count: 5, radius: 20, color: '#e91e63' },
    { count: 4, radius: 13, color: '#ff4081' }
  ];

  petalLayers.forEach(layer => {
    for (let i = 0; i < layer.count; i++) {
      let angle = (i * Math.PI * 2) / layer.count;
      ctx.save();
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(layer.radius, -layer.radius * 1.2, 0, -layer.radius * 1.8);
      ctx.quadraticCurveTo(-layer.radius, -layer.radius * 1.2, 0, 0);
      ctx.fillStyle = layer.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#e91e63';
      ctx.fill();
      ctx.restore();
    }
  });

  // Inner Golden Center
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#ffca28';
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#ffb300';
  ctx.fill();

  ctx.restore();
}

/**
 * Stage 5: Message Typewriter Effect
 */
function drawTypewriterMessage() {
  const currentText = messageText.substring(0, typedCharCount);
  ctx.save();
  ctx.font = `600 ${Math.min(width * 0.05, 34)}px 'Amiri', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Positioned elegantly below the central rose
  const posY = Math.min(height - 100, centerY + 210);

  ctx.shadowBlur = 20;
  ctx.shadowColor = '#ff80ab';
  ctx.fillStyle = '#fff0f5';
  ctx.fillText(currentText, centerX, posY);

  // Blinking Glow Cursor
  if (typedCharCount < messageText.length && Math.floor(globalTime / 20) % 2 === 0) {
    const textWidth = ctx.measureText(currentText).width;
    ctx.fillStyle = '#ff4081';
    ctx.fillRect(centerX + (textWidth / 2) + 6, posY - 15, 3, 30);
  }
  ctx.restore();
}

/**
 * Stage 6: Man's Hand (Left) and Woman's Hand (Right)
 */
function drawManHand(x, y, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  
  // Sleeve / Arm
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.moveTo(-180, 20);
  ctx.lineTo(-60, 15);
  ctx.lineTo(-50, -25);
  ctx.lineTo(-180, -35);
  ctx.closePath();
  ctx.fill();

  // Wrist Cuff
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(-62, -26, 12, 42);

  // Man's Hand Palm & Fingers (Extending to the Right)
  ctx.fillStyle = '#e0a96d'; // Slightly warmer skin tone
  
  // Palm
  ctx.beginPath();
  ctx.moveTo(-50, -22);
  ctx.lineTo(0, -18);
  ctx.quadraticCurveTo(20, 0, 10, 20);
  ctx.lineTo(-50, 18);
  ctx.closePath();
  ctx.fill();

  // Fingers reaching out
  const fingers = [
    { x: 10, y: -18, w: 32, h: 8 }, // Index
    { x: 12, y: -8,  w: 36, h: 8 }, // Middle
    { x: 8,  y: 2,   w: 32, h: 7 }, // Ring
    { x: 0,  y: 11,  w: 24, h: 6 }  // Pinky
  ];

  fingers.forEach(f => {
    ctx.beginPath();
    ctx.roundRect(f.x, f.y, f.w, f.h, 4);
    ctx.fill();
  });

  // Thumb holding position
  ctx.beginPath();
  ctx.moveTo(-25, -18);
  ctx.quadraticCurveTo(-10, -32, 10, -28);
  ctx.quadraticCurveTo(0, -18, -20, -14);
  ctx.fill();

  ctx.restore();
}

function drawWomanHand(x, y, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(255, 182, 193, 0.2)';

  // Elegant Dress Sleeve
  ctx.fillStyle = '#831843'; // Deep romantic magenta
  ctx.beginPath();
  ctx.moveTo(180, 25);
  ctx.lineTo(60, 18);
  ctx.lineTo(52, -20);
  ctx.lineTo(180, -30);
  ctx.closePath();
  ctx.fill();

  // Gold Bracelet
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.ellipse(54, -1, 4, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  // Woman's Hand Palm & Graceful Fingers (Extending to the Left)
  ctx.fillStyle = '#f7d6c8'; // Fair delicate skin tone

  // Palm
  ctx.beginPath();
  ctx.moveTo(50, -18);
  ctx.lineTo(0, -12);
  ctx.quadraticCurveTo(-15, 2, -5, 18);
  ctx.lineTo(50, 15);
  ctx.closePath();
  ctx.fill();

  // Graceful long fingers receiving
  const fingers = [
    { x: -35, y: -15, w: 36, h: 6.5, rot: 0.05 },
    { x: -38, y: -6,  w: 40, h: 6.5, rot: 0.02 },
    { x: -34, y: 3,   w: 36, h: 6,   rot: -0.02 },
    { x: -26, y: 11,  w: 28, h: 5.5, rot: -0.06 }
  ];

  fingers.forEach(f => {
    ctx.save();
    ctx.translate(f.x + f.w, f.y);
    ctx.rotate(f.rot);
    ctx.beginPath();
    ctx.roundRect(-f.w, 0, f.w, f.h, 3.5);
    ctx.fill();
    ctx.restore();
  });

  // Delicate Thumb
  ctx.beginPath();
  ctx.moveTo(25, -16);
  ctx.quadraticCurveTo(10, -30, -10, -22);
  ctx.quadraticCurveTo(0, -14, 20, -10);
  ctx.fill();

  ctx.restore();
}

/**
 * Animated Gift Rose traveling smoothly between hands
 */
function drawTravelingRose(startX, endX, y, progress) {
  // Smooth easing curve for gift travel
  const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2;
  const currentX = startX + (endX - startX) * easeProgress;
  const slightArcY = y - Math.sin(progress * Math.PI) * 35; // Gentle upward arc trajectory

  ctx.save();
  ctx.translate(currentX, slightArcY);
  ctx.rotate((progress * 0.4) - 0.2); // Subtle tilt during flight

  // Stem
  ctx.beginPath();
  ctx.moveTo(-35, 8);
  ctx.lineTo(35, -2);
  ctx.strokeStyle = '#2e7d32';
  ctx.lineWidth = 4;
  ctx.shadowBlur = 5;
  ctx.shadowColor = '#1b5e20';
  ctx.stroke();

  // Small leaf on traveling stem
  drawLeaf(-5, 3, -Math.PI / 3, 0.7);

  // Traveling Rose Bud
  drawRoseBud(35, -2, 0.85);

  // Magical trail particles behind the traveling rose
  if (progress > 0.05 && progress < 0.95) {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#ff80ab' : '#ffd54f';
      ctx.globalAlpha = Math.random() * 0.7;
      ctx.beginPath();
      ctx.arc(
        -40 - Math.random() * 30,
        (Math.random() - 0.5) * 20,
        Math.random() * 3 + 1,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
  }

  ctx.restore();
}


/**
 * Main Animation Render Loop
 */
function animate() {
  if (!isPaused) {
    globalTime++;

    // Clear canvas with subtle romantic trail fading
    ctx.fillStyle = 'rgba(8, 2, 15, 0.25)';
    ctx.fillRect(0, 0, width, height);

    // Render Ambient Particles
    ambientParticles.forEach(p => {
      p.update();
      p.draw();
    });

    // --- STAGE 1: Fireworks Explosion ---
    if (currentStage === 1) {
      if (globalTime % 18 === 0) {
        const fx = Math.random() * (width * 0.7) + width * 0.15;
        const fy = Math.random() * (height * 0.45) + height * 0.1;
        spawnFirework(fx, fy);
      }
      if (globalTime > 130) {
        currentStage = 2;
        stageStartTime = globalTime;
      }
    }

    // Update & Render Fireworks Particles
    for (let i = fireworks.length - 1; i >= 0; i--) {
      fireworks[i].update();
      fireworks[i].draw();
      if (fireworks[i].alpha <= 0) {
        fireworks.splice(i, 1);
      }
    }

    // --- STAGE 2: Drawing Glowing Heart (Right to Left) ---
    if (currentStage >= 2) {
      if (currentStage === 2) {
        heartDrawProgress += 1.8; // Smooth drawing speed
        if (heartDrawProgress >= heartPoints.length) {
          heartDrawProgress = heartPoints.length;
          currentStage = 3;
          stageStartTime = globalTime;
        }
      }

      // --- STAGE 3: Heart Splits Left & Right + Name "نرجس" Reveal ---
      if (currentStage >= 3) {
        const maxSplit = Math.min(width * 0.12, 85);
        if (heartSplitOffset < maxSplit) {
          heartSplitOffset += 1.2;
        }
        if (nameGlowAlpha < 1) {
          nameGlowAlpha += 0.015;
        } else if (currentStage === 3 && globalTime - stageStartTime > 90) {
          currentStage = 4;
          stageStartTime = globalTime;
        }
      }

      // Render Heart Halves
      ctx.save();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = '#ff1744';
      ctx.shadowBlur = 22;
      ctx.shadowColor = '#ff1744';

      // Right Half of Heart (Splits Right)
      ctx.beginPath();
      let rightStarted = false;
      for (let i = 0; i < heartDrawProgress; i++) {
        let pt = heartPoints[i];
        if (pt.x >= 0) {
          let drawX = centerX + pt.x + heartSplitOffset;
          let drawY = centerY - 25 + pt.y;
          if (!rightStarted) { ctx.moveTo(drawX, drawY); rightStarted = true; }
          else { ctx.lineTo(drawX, drawY); }
        }
      }
      ctx.stroke();

      // Left Half of Heart (Splits Left)
      ctx.beginPath();
      let leftStarted = false;
      for (let i = 0; i < heartDrawProgress; i++) {
        let pt = heartPoints[i];
        if (pt.x < 0) {
          let drawX = centerX + pt.x - heartSplitOffset;
          let drawY = centerY - 25 + pt.y;
          if (!leftStarted) { ctx.moveTo(drawX, drawY); leftStarted = true; }
          else { ctx.lineTo(drawX, drawY); }
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    // Render Glowing Name "نرجس"
    if (nameGlowAlpha > 0) {
      drawGlowingName(nameGlowAlpha);
    }

    // --- STAGE 4: Growing Rose from Bottom ---
    if (currentStage >= 4) {
      if (mainRoseStemProg < 1) {
        mainRoseStemProg += 0.015;
      } else if (mainRoseBloomProg < 1) {
        mainRoseBloomProg += 0.025;
      } else if (currentStage === 4) {
        currentStage = 5;
        stageStartTime = globalTime;
      }

      drawGrowingCenterRose(mainRoseStemProg, mainRoseBloomProg);
    }

    // --- STAGE 5: Typewriter Text "من محمد إليك يا أحلى وردة" ---
    if (currentStage >= 5) {
      typeWriterTimer++;
      if (typeWriterTimer % 6 === 0 && typedCharCount < messageText.length) {
        typedCharCount++;
      }
      drawTypewriterMessage();

      if (typedCharCount >= messageText.length && currentStage === 5 && globalTime - stageStartTime > 140) {
        currentStage = 6;
        stageStartTime = globalTime;
      }
    }

    // --- STAGE 6: Hands & Rose Transfer Scene ---
    if (currentStage >= 6) {
      if (handsProgress < 1) {
        handsProgress += 0.015;
      } else if (roseTravelProgress < 1) {
        roseTravelProgress += 0.008; // Smooth elegant glide
      } else {
        // Continuous gentle fireworks celebration at climax
        if (globalTime % 45 === 0) {
          spawnFirework(
            Math.random() > 0.5 ? width * 0.2 : width * 0.8,
            Math.random() * (height * 0.4) + height * 0.1
          );
        }
      }

      // Responsive positioning for hands scene
      const yPos = Math.min(height - 110, centerY + 180);
      const manTargetX = Math.max(100, width * 0.22);
      const womanTargetX = Math.min(width - 100, width * 0.78);

      // Interpolate slide-in positions
      const currentManX = -100 + (manTargetX + 100) * handsProgress;
      const currentWomanX = width + 100 - (width + 100 - womanTargetX) * handsProgress;

      const responsiveScale = Math.min(Math.max(width / 1200, 0.75), 1.15);

      // Draw Man Hand (Left) and Woman Hand (Right)
      drawManHand(currentManX, yPos, responsiveScale);
      drawWomanHand(currentWomanX, yPos, responsiveScale);

      // Draw Gliding Rose between the two hands
      if (handsProgress > 0.6) {
        const roseStartX = currentManX + 30 * responsiveScale;
        const roseEndX = currentWomanX - 45 * responsiveScale;
        drawTravelingRose(roseStartX, roseEndX, yPos - 10, roseTravelProgress);
      }
    }
  }

  requestAnimationFrame(animate);
}

// Button Listeners
document.getElementById('replayBtn').addEventListener('click', () => {
  resetAnimation();
});

const pauseBtn = document.getElementById('pauseBtn');
const pauseIcon = document.getElementById('pauseIcon');
const pauseText = document.getElementById('pauseText');

pauseBtn.addEventListener('click', () => {
  isPaused = !isPaused;
  if (isPaused) {
    pauseIcon.textContent = '▶️';
    pauseText.textContent = 'تشغيل';
  } else {
    pauseIcon.textContent = '⏸️';
    pauseText.textContent = 'إيقاف مؤقت';
  }
});


animate();

</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفتاح قلبي ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Tajawal", "Arial", sans-serif;
    background:
        radial-gradient(circle at 50% 40%, #fff0f5 0%, #ffd6e5 25%, #b8325a 65%, #4b1027 100%);
    color: white;
}

/* الخلفية */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
}

/* ورود الخلفية */
.flower {
    position: absolute;
    font-size: 30px;
    opacity: 0.65;
    animation: floatFlower linear infinite;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.25));
}

@keyframes floatFlower {
    0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: .7;
    }
    85% {
        opacity: .7;
    }
    100% {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
    }
}

/* طبقة المحتوى */
.container {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* البطاقة */
.card {
    width: min(92%, 600px);
    min-height: 600px;
    padding: 25px;
    text-align: center;
    border-radius: 35px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(12px);
    box-shadow:
        0 25px 70px rgba(70,0,25,.45),
        inset 0 0 30px rgba(255,255,255,.08);
}

/* العنوان */
.title {
    font-size: 25px;
    margin-bottom: 5px;
    text-shadow: 0 3px 10px rgba(0,0,0,.35);
}

.subtitle {
    font-size: 14px;
    opacity: .8;
    margin-bottom: 10px;
}

/* منطقة القلب */
.heart-area {
    height: 330px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* القلب */
.heart {
    position: relative;
    width: 145px;
    height: 145px;
    transform: rotate(-45deg) scale(0);
    background: linear-gradient(135deg, #ff174f, #a90035);
    box-shadow:
        0 0 25px #ff174f,
        0 0 60px rgba(255,23,79,.7);
    animation: drawHeart 3s forwards;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 145px;
    background: inherit;
    border-radius: 50%;
}

.heart::before {
    top: -72px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 72px;
}

@keyframes drawHeart {
    0% {
        transform: rotate(-45deg) scale(0);
        opacity: 0;
    }

    60% {
        transform: rotate(-45deg) scale(1.08);
        opacity: 1;
    }

    100% {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
    }
}

/* القفل */
.lock {
    position: absolute;
    z-index: 10;
    width: 42px;
    height: 50px;
    background: #ffd45a;
    border-radius: 7px;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    box-shadow:
        0 0 12px #ffd45a,
        0 0 30px rgba(255,212,90,.8);
}

.lock::before {
    content: "";
    position: absolute;
    width: 27px;
    height: 27px;
    border: 7px solid #ffd45a;
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    left: 50%;
    top: -25px;
    transform: translateX(-50%);
}

.lock::after {
    content: "•";
    position: absolute;
    color: #8a4d00;
    font-size: 27px;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
}

/* صندوق كلمة السر */
.password-box {
    transition: .5s;
}

.password-box input {
    width: 70%;
    max-width: 320px;
    padding: 14px 20px;
    border: none;
    outline: none;
    border-radius: 30px;
    text-align: center;
    font-size: 17px;
    color: #8b173e;
    background: rgba(255,255,255,.95);
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.password-box button {
    margin-top: 12px;
    padding: 12px 30px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    background: linear-gradient(135deg,#ffd76a,#ffb72b);
    color: #702100;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
    transition: .3s;
}

.password-box button:hover {
    transform: scale(1.05);
}

.message {
    min-height: 25px;
    margin-top: 10px;
    font-size: 14px;
}

/* المفتاح */
.key {
    position: absolute;
    z-index: 30;
    width: 100px;
    height: 45px;
    cursor: grab;
    display: none;
    align-items: center;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.4));
    touch-action: none;
    user-select: none;
}

.key:active {
    cursor: grabbing;
}

.key-head {
    width: 45px;
    height: 45px;
    border: 7px solid #ffd65c;
    border-radius: 50%;
    box-shadow: 0 0 15px #ffd65c;
}

.key-head::after {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    background: transparent;
    border: 4px solid #ffd65c;
    border-radius: 50%;
    left: 14px;
    top: 14px;
}

.key-body {
    width: 55px;
    height: 10px;
    background: linear-gradient(#ffe582,#e7a91e);
    box-shadow: 0 0 10px #ffd65c;
}

.key-teeth {
    width: 20px;
    height: 18px;
    border-left: 7px solid #ffd65c;
    border-bottom: 7px solid #ffd65c;
    margin-left: -4px;
}

/* تعليمات */
.open-message {
    display: none;
    margin-top: 8px;
    font-size: 18px;
    font-weight: bold;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.05);
        text-shadow: 0 0 20px #fff;
    }
}

/* الرسالة داخل القلب */
.final-message {
    position: absolute;
    z-index: 50;
    width: 80%;
    max-width: 400px;
    display: none;
    opacity: 0;
    color: white;
    text-align: center;
    font-size: 19px;
    line-height: 2;
    font-weight: bold;
    text-shadow: 0 2px 10px rgba(80,0,20,.7);
    animation: messageAppear 2s forwards;
}

@keyframes messageAppear {
    from {
        opacity: 0;
        transform: scale(.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* تأثير فتح القلب */
.heart.opened {
    animation: heartOpen 1.2s forwards;
}

@keyframes heartOpen {
    0% {
        transform: rotate(-45deg) scale(1);
    }

    50% {
        transform: rotate(-45deg) scale(1.18);
        filter: brightness(1.4);
    }

    100% {
        transform: rotate(-45deg) scale(.75);
        opacity: .2;
    }
}

/* المفرقعات */
.firework {
    position: fixed;
    z-index: 100;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
}

.particle {
    position: fixed;
    z-index: 100;
    font-size: 20px;
    pointer-events: none;
    animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(0,0) scale(.5);
        opacity: 1;
    }

    to {
        transform: translate(var(--x),var(--y)) scale(1.4);
        opacity: 0;
    }
}

/* الجوال */
@media(max-width:600px) {

    .card {
        min-height: 560px;
        padding: 15px;
    }

    .heart-area {
        height: 300px;
    }

    .heart,
    .heart::before,
    .heart::after {
        width: 120px;
        height: 120px;
    }

    .heart::before {
        top: -60px;
    }

    .heart::after {
        left: 60px;
    }

    .lock {
        transform: translate(-50%, -50%) scale(.9);
    }

    .final-message {
        font-size: 16px;
        line-height: 1.9;
    }

    .password-box input {
        width: 90%;
    }
}
</style>
</head>

<body>

<!-- الخلفية -->
<div class="background" id="background"></div>

<div class="container">

    <div class="card">

        <h1 class="title">❤️ سر صغير من القلب ❤️</h1>
        <p class="subtitle">هناك شيء ينتظر من يملك مفتاحه...</p>

        <div class="heart-area" id="heartArea">

            <!-- القلب -->
            <div class="heart" id="heart"></div>

            <!-- القفل -->
            <div class="lock" id="lock"></div>

            <!-- الرسالة النهائية -->
            <div class="final-message" id="finalMessage">
                مرحبا بك يا ملكة قلبي ❤️
                <br>
                وسلطانة حياتي،
                <br>
                ويا تاج 👑 رأسي
                <br>
                <strong>نرجس الغالية</strong> 🌹
                <br>
                يا من ملكت مفتاح قلبي ❤️🔑
            </div>

            <!-- المفتاح -->
            <div class="key" id="key">

                <div class="key-head"></div>

                <div class="key-body"></div>

                <div class="key-teeth"></div>

            </div>

        </div>

        <!-- كلمة السر -->
        <div class="password-box" id="passwordBox">

            <input
                type="password"
                id="password"
                placeholder="🔐 أدخلي كلمة السر"
            >

            <br>

            <button onclick="checkPassword()">
                فتح السر ❤️
            </button>

            <div class="message" id="message"></div>

        </div>

        <div class="open-message" id="openMessage">
            🔑 المفتاح ظهر... افتحي قلبي ❤️
        </div>

    </div>

</div>


<script>

/* =====================================
   إنشاء ورود الخلفية
===================================== */

const flowers = [
    "🌹","🌷","🌸","🌺","🌻","🌼","💮","🥀"
];

const background = document.getElementById("background");

for(let i = 0; i < 45; i++){

    const flower = document.createElement("div");

    flower.className = "flower";

    flower.textContent =
        flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left =
        Math.random() * 100 + "%";

    flower.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    flower.style.animationDelay =
        (-Math.random() * 15) + "s";

    flower.style.fontSize =
        (20 + Math.random() * 30) + "px";

    background.appendChild(flower);
}


/* =====================================
   كلمة السر
===================================== */

const correctPassword = "نرجس";

let keyUnlocked = false;

function checkPassword(){

    const input =
        document.getElementById("password");

    const message =
        document.getElementById("message");

    if(input.value.trim() === correctPassword){

        keyUnlocked = true;

        message.textContent =
            "✨ صحيح... لقد وجدتِ السر ❤️";

        message.style.color = "#fff";

        document.getElementById("passwordBox").style.display = "none";

        document.getElementById("openMessage").style.display = "block";

        showKey();

    } else {

        message.textContent =
            "❌ كلمة السر غير صحيحة... المفتاح ما زال مخفيًا 🔐";

        message.style.color = "#ffd0dc";

        input.value = "";

        input.focus();
    }
}


/* =====================================
   إظهار المفتاح
===================================== */

const key = document.getElementById("key");

function showKey(){

    key.style.display = "flex";

    /*
       البداية تكون أسفل القلب
    */

    key.style.left = "12%";
    key.style.top = "20%";

}


/* =====================================
   تحريك المفتاح بالماوس واللمس
===================================== */

let dragging = false;

let offsetX = 0;
let offsetY = 0;

function startDrag(e){

    if(!keyUnlocked) return;

    dragging = true;

    const rect = key.getBoundingClientRect();

    const clientX =
        e.touches ? e.touches[0].clientX : e.clientX;

    const clientY =
        e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;

    e.preventDefault();
}


function moveDrag(e){

    if(!dragging) return;

    const clientX =
        e.touches ? e.touches[0].clientX : e.clientX;

    const clientY =
        e.touches ? e.touches[0].clientY : e.clientY;

    let x = clientX - offsetX;
    let y = clientY - offsetY;

    const maxX = window.innerWidth - key.offsetWidth;
    const maxY = window.innerHeight - key.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    key.style.left = x + "px";
    key.style.top = y + "px";

}


function stopDrag(){

    if(!dragging) return;

    dragging = false;

    checkKeyPosition();
}


key.addEventListener("mousedown", startDrag);
document.addEventListener("mousemove", moveDrag);
document.addEventListener("mouseup", stopDrag);

key.addEventListener("touchstart", startDrag, {
    passive:false
});

document.addEventListener("touchmove", moveDrag, {
    passive:false
});

document.addEventListener("touchend", stopDrag);


/* =====================================
   معرفة هل وصل المفتاح للقفل
===================================== */

function checkKeyPosition(){

    const keyRect =
        key.getBoundingClientRect();

    const lockRect =
        document.getElementById("lock").getBoundingClientRect();

    const keyCenterX =
        keyRect.left + keyRect.width / 2;

    const keyCenterY =
        keyRect.top + keyRect.height / 2;

    const lockCenterX =
        lockRect.left + lockRect.width / 2;

    const lockCenterY =
        lockRect.top + lockRect.height / 2;

    const distance =
        Math.sqrt(
            Math.pow(keyCenterX - lockCenterX, 2) +
            Math.pow(keyCenterY - lockCenterY, 2)
        );

    if(distance < 80){

        openHeart();

    }
}


/* =====================================
   فتح القلب
===================================== */

let heartOpened = false;

function openHeart(){

    if(heartOpened) return;

    heartOpened = true;

    const heart =
        document.getElementById("heart");

    const lock =
        document.getElementById("lock");

    const openMessage =
        document.getElementById("openMessage");

    heart.classList.add("opened");

    lock.style.display = "none";

    key.style.display = "none";

    openMessage.style.display = "none";

    setTimeout(() => {

        document.getElementById("finalMessage").style.display = "block";

        createFireworks();

    }, 700);

}


/* =====================================
   المفرقعات والقلوب
===================================== */

function createFireworks(){

    const symbols = [
        "❤️",
        "💖",
        "💕",
        "🌹",
        "✨",
        "💗",
        "🌸",
        "💫"
    ];

    for(let burst = 0; burst < 12; burst++){

        setTimeout(() => {

            const centerX =
                10 + Math.random() * 80;

            const centerY =
                10 + Math.random() * 65;

            for(let i = 0; i < 25; i++){

                const particle =
                    document.createElement("div");

                particle.className = "particle";

                particle.textContent =
                    symbols[
                        Math.floor(
                            Math.random() * symbols.length
                        )
                    ];

                particle.style.left =
                    centerX + "%";

                particle.style.top =
                    centerY + "%";

                const angle =
                    Math.random() * Math.PI * 2;

                const distance =
                    50 + Math.random() * 150;

                particle.style.setProperty(
                    "--x",
                    Math.cos(angle) * distance + "px"
                );

                particle.style.setProperty(
                    "--y",
                    Math.sin(angle) * distance + "px"
                );

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 1600);
            }

        }, burst * 250);
    }
}


/* =====================================
   Enter من لوحة المفاتيح
===================================== */

document
.getElementById("password")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        checkPassword();

    }

});

</script>

</body>
</html>
